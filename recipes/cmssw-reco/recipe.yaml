context:
  cmssw_tag: CMSSW_20_1_0_pre2
  version: "20.1.0pre2"

package:
  name: cmssw-reco
  version: ${{ version }}

source:
  - url: https://github.com/cms-sw/cmssw/archive/refs/tags/${{ cmssw_tag }}.tar.gz
    sha256: 39afc8deff3e31952cc43699324b25bbc10e619abe616b0eb6c3c20b4746312e
    target_directory: cmssw
    patches:
      - patches/0001-Geometry-leave-out-the-Fireworks-based-validation-plugins.patch
      # RecoTracker/FinalTrackSelectors' alpaka plugins run a PyTorch model
      - patches/0002-RecoTracker-FinalTrackSelectors-leave-out-the-PyTorch-plugins.patch
      - patches/0003-PhysicsTools-MVAComputer-declare-boost-filesystem.patch
      # Code that only compiles against libstdc++, which libc++ (macOS) rejects:
      # - <ext/...> headers: unused ones are dropped, and __gnu_cxx::is_sorted becomes
      #   std::is_sorted, which is the same algorithm standardised in C++11;
      # - a std::vector iterator constructed from a raw pointer, which becomes `auto`;
      # - TrackerMap's std::map<const int, T> assigned to std::map<int, T>::iterator. In
      #   libstdc++ both are the same iterator type; in libc++ the key type is part of it, so
      #   the redundant const (map keys are always const) goes;
      # - `%jx` given a uint64_t, which is unsigned long long on macOS, not uintmax_t.
      # The MTD one matters most: GeometricTimingDet.h is under RecoMTD/DetLayers and
      # TrackingTools/RecoGeometry, so without it almost all of RecoTracker fails to link.
      - patches/0004-Do-not-rely-on-libstdc-extensions-missing-from-libc.patch
      # CalibTracker/SiStripCommon's plugins name PhysicsTools/NanoAOD, but only include
      # DataFormats/NanoAOD's FlatTable. NanoAOD has no library, so the <use> only put its
      # headers on the include path; naming it tied this layer to a package whose plugins
      # need PAT, which is built in cmssw-reco-objects.
      - patches/0005-CalibTracker-SiStripCommon-plugins-declare-DataFormats-NanoAOD.patch

build:
  number: 5
  skip:
    - win
    - osx and x86_64
  script:
    env:
      CMSSW_TAG: ${{ cmssw_tag }}
    file: build.sh
  dynamic_linking:
    rpath_allowlist:
      - share/cmssw/**
  prefix_detection:
    ignore_binary_files: true

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ compiler('fortran') }}
    - ${{ stdlib('c') }}
    - cms-scram
    - cmssw-toolbox ==${{ version }}
    - make
    - bash
    - sed
    - coreutils
    - findutils
    - grep
    - gawk
    - which
    - rsync
    # the CondFormats serialization code is generated with libclang
    - clangxx
  host:
    - cms-scram
    - cmssw-geometry ==${{ version }}
    # the same externals as the layers below, because the release's headers include them
    - python
    - numpy
    - root_base
    # root_base comes in cxx20 and cxx23 builds; CMSSW 20_1 is C++20
    - root_cxx_standard
    - libboost-devel
    - tbb-devel
    - clhep
    - fmt
    - xerces-c
    - libuuid
    - eigen
    - vdt
    - hepmc2
    - hepmc3
    - tinyxml2
    - zlib
    - xz
    - zstd
    - bzip2
    - pcre2
    - openssl
    - libxcrypt
    - gsl
    - openblas
    - alpaka
    - hls-arbitrary-precision-types
    - cms-md5
    - coral
    - frontier-client
    - sqlite
    - expat
    - libcurl
    - pybind11
    - libboost-python-devel
    # this layer brings in more CondFormats packages, whose serialization is generated
    - python-clang
    - libclang
    - dd4hep
    - geant4
    # new in this layer
    # track refitting for alignment: RecoTracker/TrackProducer's plugins reach these
    # through Alignment/ReferenceTrajectories
    - gbl
    - mille
    # jet clustering, used by CommonTools/PileupAlgos and the muon rechit clusterer. The C++
    # library, not `fastjet`, which is the python bindings.
    # Build 5 is the last one that ships the headers. Build 6 (2026-09-22) moved them to a new
    # fastjet-cxx-devel, which requires cgal-cpp; every current cgal-cpp requires eigen-abi
    # 5.0.1, conda-forge's lwtnn requires eigen-abi 3.4.0, and so the solver falls back to
    # cgal-cpp 5.x and the long-gone boost-cpp and cannot resolve. The local lwtnn rebuild
    # (cmssw-notes/feedstock-changes/lwtnn) is on Eigen 5, so fastjet-cxx-devel can be taken
    # once that is upstream.
    - fastjet-cxx ==3.5.1 *_5
    - fastjet-contrib
    # particle properties, for SimGeneral/HepPDTRecord
    - heppdt
    # nlohmann/json, header only; RecoTracker/MkFitCore reads its configuration with it
    - nlohmann_json
    # the neural-net evaluator RecoTracker/FinalTrackSelectors uses for track quality
    - lwtnn
    # PhysicsTools/TensorFlow, and through it mkFit's output converter, the DeepCore seeding,
    # the TensorFlow track classifier and the displaced-region seeding. conda-forge's is behind
    # the global Abseil/protobuf pins, so variants.yaml pins those to its versions.
    # 2.19.1, not 2.21.0. Both export the symbols of their bundled LLVM, but 2.21's clash with
    # ROOT's own LLVM: on Linux it crashes when loaded through TSystem::Load after ROOT's
    # interpreter has started (the build's class version checks do that, and so does ROOT's
    # dictionary autoloading), on macOS when loaded before the interpreter starts. 2.19.1
    # loads cleanly in both orders and both ways on linux-64 and osx-arm64 (and builds and
    # passes the tests on linux-aarch64, the only version there).
    - libtensorflow_cc ==2.19.1 cpu_*
  run:
    - cms-scram
    - cmssw-geometry ==${{ version }}
    - python
    - root_base
    - coral
    - frontier-client
    # ROOT parses the release's headers at runtime, so these are run dependencies too
    - dd4hep
    - geant4
    - gbl
    - mille
    # no dictionary here includes a fastjet header, so the libraries are enough at runtime
    - fastjet-cxx
    - fastjet-contrib
    - heppdt
    - lwtnn
    - libtensorflow_cc ==2.19.1 cpu_*
  ignore_run_exports:
    from_package:
      - libclang
      - python-clang

tests:
  - script:
      - python -c "import ctypes, glob, os; libs = glob.glob(os.path.join(os.environ['CMSSW_BASE'], 'lib', os.environ['SCRAM_ARCH'], '*.[ds][oy]*')); assert libs; [ctypes.CDLL(lib, mode=ctypes.RTLD_GLOBAL) for lib in sorted(libs)]; print(len(libs), 'libraries loaded')"
      # the reconstruction plugins this layer exists for must be registered
      - edmPluginDump | grep -q TrackProducer
      - edmPluginDump | grep -q CkfTrackCandidateMaker
      - edmPluginDump | grep -q PrimaryVertexProducer
      - edmPluginDump | grep -q MuonIdProducer
      # the muon geometry ESModules, whose Fireworks validation plugins patch 0001 removes
      - edmPluginDump | grep -q DTGeometryESModule
      - edmPluginDump | grep -q CSCGeometryESModule
      # the other plugins of the package patch 0002 touches
      - edmPluginDump | grep -q TrackCollectionMerger
      # the TensorFlow ones: PhysicsTools/TensorFlow's graph loader and the plugins that run
      # an inference, whose generated cfi RecoTracker's _cff fragments import
      - edmPluginDump | grep -q TfGraphDefProducer
      - edmPluginDump | grep -q TrackTfClassifier
      - edmPluginDump | grep -q MkFitOutputConverter
      - edmPluginDump | grep -q DeepCoreSeedGenerator
      - edmPluginDump | grep -q DisplacedRegionSeedingVertexProducer
      - edmPluginDump | grep -q MkFitProducer
      # the SiStrip calibration tables, whose BuildFile patch 0005 changes
      - edmPluginDump | grep -q SiStripLorentzAngleRunInfoTableProducer
      - cmsRun test/tracking.py
    files:
      recipe:
        - test/

about:
  homepage: https://cms-sw.github.io
  summary: CMS reconstruction - tracking, vertexing and muons
  description: |
    CMSSW is the software framework of the CMS experiment at CERN. This package adds
    reconstruction on top of cmssw-geometry: local reconstruction in the tracker, the
    Kalman-filter track finding and fitting chain, primary and secondary vertex
    reconstruction, muon reconstruction and identification, and the rest of the detector
    geometry that those need.

    It includes the TensorFlow interface (PhysicsTools/TensorFlow) and the tracking plugins
    that run a TensorFlow model. Some plugins are left out: the ones that run a PyTorch
    model, which is not packaged, and the dE/dx estimators, which need the HLT framework
    (HLTrigger/HLTcore) from cmssw-reco-objects.
  license: Apache-2.0
  license_file: cmssw/LICENSE
  repository: https://github.com/cms-sw/cmssw

extra:
  recipe-maintainers:
    - ariostas
