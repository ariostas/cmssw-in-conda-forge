# Each CMSSW release is validated against one ROOT and one CLHEP version, so build
# only against the conda-forge versions closest to the ones used by that release
# (CMSSW_20_1_0_pre2: ROOT 6.36.13, CLHEP 2.4.7.2) instead of the full global pinning.
# root_base is zipped with root_cxx_standard, and clhep with geant4, in the global pinning.
# On osx-arm64 that is 6.36.10, and conda-forge's 6.36 is unusable at runtime: it ships
# prebuilt Darwin system modules built against /opt/conda-sdks/MacOSX11.0.sdk, and cling then
# fails on a plain `#include <unistd.h>` with any other SDK. ROOT 6.38 generates the Darwin
# modulemap from the active SDK instead (root-project/root dfc83fa305), so macOS builds against
# 6.40, which is NOT the ROOT version this CMSSW release was validated against. Drop the
# exception once conda-forge's 6.36.x carries that change, or once CMSSW moves to a ROOT
# conda-forge ships working macOS builds of.
root_base:
  - if: osx
    then: "6.40.2"
    else: "6.36.10"
root_cxx_standard:
  - "20"
clhep:
  - "2.4.7.2"
geant4:
  - "11.4.2"

# std::to_chars/from_chars for floating point types (used by std::format) need macOS 13.3
c_stdlib_version:
  - if: osx
    then: "13.3"
MACOSX_DEPLOYMENT_TARGET:
  - if: osx
    then: "13.3"

# conda-forge is migrating boost 1.88 -> 1.90 (migrations/libboost190.yaml in the pinning).
# DD4hep is already built against 1.90 on every variant, so the geometry layer cannot be
# installed next to a stack pinned at 1.88; these take the migration early. Drop this block
# once the global pinning moves and the values come from there.
libboost_devel:
  - "1.90"
libboost_headers:
  - "1.90"
libboost_python_devel:
  - "1.90"

# conda-forge's libtensorflow_cc is behind the global pinning's Abseil and protobuf (20260526 and
# 7.35.1). The 2.19.1 the layers use (see cmssw-reco) is built against 20260107 and 6.33.5 on
# linux-64 and osx-arm64; linux-aarch64, which the feedstock no longer builds, has it only
# against 20250512 and 6.31.1. Everything in the stack that links either has to agree with
# it, so take its versions. Drop this block once the feedstock catches up with the migrations
# (and builds linux-aarch64 again).
libabseil:
  - if: aarch64
    then: "20250512"
    else: "20260107"
libprotobuf:
  - if: aarch64
    then: "6.31.1"
    else: "6.33.5"
libgrpc:
  - if: aarch64
    then: "1.73"
    else: "1.78"
