context:
  cmssw_tag: CMSSW_20_1_0_pre2
  version: "20.1.0pre2"

package:
  name: cmssw-reco-objects
  version: ${{ version }}

source:
  - url: https://github.com/cms-sw/cmssw/archive/refs/tags/${{ cmssw_tag }}.tar.gz
    sha256: 39afc8deff3e31952cc43699324b25bbc10e619abe616b0eb6c3c20b4746312e
    target_directory: cmssw
    patches:
      # RecoJets/JetAlgorithms names KtJet, a library from 2005 that conda-forge does not
      # have, but no file in the package includes it: jet clustering is FastJet.
      - patches/0001-RecoJets-JetAlgorithms-drop-the-unused-ktjet-dependency.patch
      # ONNX Runtime installs its public headers flat under include/onnxruntime/;
      # conda-forge's onnxruntime-cpp keeps the source tree's core/session/ layout.
      - patches/0002-PhysicsTools-ONNXRuntime-accept-the-source-tree-header-layout.patch
      # Code that only compiles with libstdc++ or on targets with 16-byte vector alignment:
      # - RecoTracker/LSTCore reads its geometry with std::ifstream without <fstream>;
      # - RecoTracker/LST calls std::ranges::size on TrajectorySeed's hit range, which is not a
      #   sized range for libc++; the seed's own nHits() gives the same number;
      # - code that uses the internals of the SIMD geometry vectors, which only exist where
      #   DataFormats/Math/interface/SIMDVec.h selects the extended vector syntax. Apple arm64
      #   reports __BIGGEST_ALIGNMENT__ 8 and gets the scalar classes instead, with no .v and
      #   no fourth lane. RecoParticleFlow/PFClusterTools does element-wise arithmetic on
      #   Basic2DVector<double>::MathVector (whose scalar operator* is a dot product), now
      #   written per coordinate; RecoLocalCalo/CaloTowersCreator keeps the tower energy in
      #   the fourth lane of a Basic3DVectorF, now in a float of its own. Both compute the
      #   same values as before, with the same rounding;
      # - DataFormats/CTPPSReco declares CTPPSPixelLocalTrack::operator< non-const, and libc++'s
      #   sort compares const objects;
      # - CalibCalorimetry/HcalTPGAlgos prints a uint64_t with %lx, and uint64_t is unsigned
      #   long long on macOS;
      # - Alignment/Geners derives two streams from std::basic_iostream and relies on the
      #   default constructor libstdc++ adds; the standard (and libc++) only has the one taking
      #   a streambuf.
      - patches/0004-Build-with-libc-and-on-Apple-arm64.patch
      # The L1 trigger packages that the L1 menu library brings in (2026-09-26), on libc++:
      # - L1Trigger/GlobalMuonTrigger keeps its shared configuration in a
      #   std::atomic<std::shared_ptr>, which libc++ does not implement; it is set once by the
      #   first instance, so std::call_once does the same;
      # - L1Trigger/RPCTrigger constructs a std::map iterator from nullptr.
      - patches/0005-L1-trigger-build-with-libc.patch
      # The L1 packages TensorFlow brings in (2026-09-27) use std::pair (L1Trigger/L1TMuonEndCap)
      # and std::numbers (L1Trigger/L1TTrackMatch) without including <utility> and <numbers>,
      # which libstdc++ happens to include for them and libc++ does not.
      - patches/0006-L1-trigger-include-utility-and-numbers-for-libc.patch
      # PhysicsTools/PatAlgos uses __gnu_cxx::is_sorted from libstdc++'s <ext/algorithm>,
      # which libc++ does not have; std::is_sorted is the same algorithm, standardised in
      # C++11 (cmssw-reco's 0004 does the same elsewhere).
      - patches/0007-PhysicsTools-PatAlgos-use-std-is_sorted.patch
      # PhysicsTools/KinFitter and AnalysisDataFormats/TopObjects call setiosflags() and
      # resetiosflags() unqualified. libstdc++'s fmtflags is an enum in std, so
      # argument-dependent lookup finds std::setiosflags; libc++'s is an integer, so nothing
      # does.
      - patches/0008-Qualify-setiosflags-for-libc.patch
      # NanoAOD's TauSpinner table (tau polarisation weights for simulation) needs Tauola++,
      # which conda-forge does not have; the patch removes the plugin, its cfi and its place
      # in the simulation tables (nano_cff.py, custom_muon_cff.py). Everything else in
      # NanoAOD, data and simulation, is unchanged; simulated NanoAOD has no TauSpinner_*
      # branches.
      - patches/0009-PhysicsTools-NanoAOD-leave-out-the-TauSpinner-table.patch
      # The plugins that run a model on a Triton inference server (SONIC) instead of in the
      # process: three b-tagging ones (RecoBTag/ONNXRuntime), the e/gamma energy regression
      # (RecoEgamma/EgammaTools' DRN) and DeepTau's (RecoTauTag/RecoTau). The Triton client is
      # not packaged, and each of those packages has one plugin library, so without the patch
      # none of their other plugins could be built either: the in-process b-taggers, e/gamma
      # energy calibration and tau identification, which NanoAOD runs. The cfis generated
      # from the removed plugins' parameter descriptions are added as source, copied from
      # CMS's build of this release, because the b-tagging and tau configuration imports them
      # whether or not the Triton process modifiers that use them are enabled.
      - patches/0010-Leave-out-the-Triton-inference-plugins-keep-their-cfis.patch
      # NanoAOD's generator weight table sorts its scale variations with a non-const
      # operator<, which libc++'s sort cannot call on the const objects it compares (as for
      # CTPPSPixelLocalTrack in 0004).
      - patches/0011-PhysicsTools-NanoAOD-const-comparison-operator-for-libc.patch

build:
  number: 4
  skip:
    - win
    - osx and x86_64
  script:
    env:
      CMSSW_TAG: ${{ cmssw_tag }}
    file: build.sh
  dynamic_linking:
    rpath_allowlist:
      - share/cmssw/**
  prefix_detection:
    ignore_binary_files: true

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ compiler('fortran') }}
    - ${{ stdlib('c') }}
    - cms-scram
    - cmssw-toolbox ==${{ version }}
    - make
    - bash
    - sed
    - coreutils
    - findutils
    - grep
    - gawk
    - which
    - rsync
    # protoc, for prepare.sh
    - libprotobuf
    # the CondFormats serialization code is generated with libclang
    - clangxx
  host:
    - cms-scram
    - cmssw-reco ==${{ version }}
    # the same externals as the layers below, because the release's headers include them
    - python
    - numpy
    - root_base
    # root_base comes in cxx20 and cxx23 builds; CMSSW 20_1 is C++20
    - root_cxx_standard
    - libboost-devel
    - tbb-devel
    - clhep
    - fmt
    - xerces-c
    - libuuid
    - eigen
    - vdt
    - hepmc2
    - hepmc3
    - tinyxml2
    - zlib
    - xz
    - zstd
    - bzip2
    - pcre2
    - openssl
    - libxcrypt
    - gsl
    - openblas
    - alpaka
    - hls-arbitrary-precision-types
    - cms-md5
    - coral
    - frontier-client
    - sqlite
    - expat
    - libcurl
    - pybind11
    - libboost-python-devel
    # this layer brings in more CondFormats packages, whose serialization is generated
    - python-clang
    - libclang
    - dd4hep
    - geant4
    # from the reco layer
    # track refitting for alignment: RecoTracker/TrackProducer's plugins reach these
    # through Alignment/ReferenceTrajectories
    - gbl
    - mille
    # jet clustering, used by CommonTools/PileupAlgos and the muon rechit clusterer. The C++
    # library, not `fastjet`, which is the python bindings.
    # Build 5 is the last one that ships the headers. Build 6 (2026-09-22) moved them to a new
    # fastjet-cxx-devel, which requires cgal-cpp; every current cgal-cpp requires eigen-abi
    # 5.0.1, conda-forge's lwtnn requires eigen-abi 3.4.0, and so the solver falls back to
    # cgal-cpp 5.x and the long-gone boost-cpp and cannot resolve. The local lwtnn rebuild
    # (cmssw-notes/feedstock-changes/lwtnn) is on Eigen 5, so fastjet-cxx-devel can be taken
    # once that is upstream.
    - fastjet-cxx ==3.5.1 *_5
    - fastjet-contrib
    # particle properties, for SimGeneral/HepPDTRecord
    - heppdt
    # nlohmann/json, header only; RecoTracker/MkFitCore reads its configuration with it
    - nlohmann_json
    # the neural-net evaluator RecoTracker/FinalTrackSelectors uses for track quality
    - lwtnn
    # new in this layer
    # CMS's socket and I/O library; DQMServices/Core's network protocol (DQMNet) uses it
    - classlib
    - pcre
    # DQMServices/Core writes its histograms as protobuf; prepare.sh regenerates the C++ with
    # the protoc in `build`, which the global pinning keeps at the same version as this
    - libprotobuf
    # the CPU build; the CUDA one would pull the CUDA runtime in for nothing
    - onnxruntime-cpp * *_cpu
    # boosted decision trees for photon identification (PhysicsTools/XGBoost)
    - libxgboost * cpu_*
    # The L1 trigger menu library, for the L1 conditions formats (CondFormats/L1TObjects) and
    # everything above them: RPC formats, the L1 unpackers and emulator. ASSUMED LICENCE: utm
    # has none yet; see recipes/cms-l1t-utm.
    - cms-l1t-utm
    # boosted decision trees in the Phase-2 L1 track trigger (L1Trigger/TrackTrigger)
    - conifer-cpp
    # the L1 trigger's ML models: their loader, which the endcap muon track finder
    # (L1Trigger/L1TMuonEndCap) uses, and AXOL1TL, the anomaly detection the L1 Global
    # Trigger emulator (L1Trigger/L1TGlobal) runs. ASSUMED LICENCE, like utm's; see the
    # recipes.
    - cms-hls4ml-emulator-extras
    - cms-hls4ml-axol1tl
    # the legacy CSC track finder's emulation, for L1Trigger/CSCTrackFinder, whose code the
    # MET producers' beam-halo identification includes. ASSUMED LICENCE, like utm's; see
    # the recipe.
    - cms-csctrackfinderemulation
    # particle-level objects and the Higgs template cross-section classification, which
    # simulated NanoAOD computes with GeneratorInterface/RivetInterface
    - rivet
    - yoda
  run:
    - cms-scram
    # The exact build of the layer below this one was built against: a layer links that
    # layer's libraries, and a newer build can add some (cmssw-reco's build 4 has
    # PhysicsTools/TensorFlow). With only the version pinned, the solver took cmssw-reco
    # build 3 under cmssw-reco-objects build 3, which needs the newer one's libraries.
    - ${{ pin_compatible("cmssw-reco", exact=True) }}
    - python
    - root_base
    - coral
    - frontier-client
    # ROOT parses the release's headers at runtime, so these are run dependencies too
    - dd4hep
    - geant4
    - gbl
    - mille
    - fastjet-cxx
    - fastjet-contrib
    - heppdt
    - lwtnn
    # new in this layer
    - classlib
    - libprotobuf
    - onnxruntime-cpp * *_cpu
    - libxgboost * cpu_*
    - cms-l1t-utm
    - conifer-cpp
    - cms-hls4ml-emulator-extras
    - cms-hls4ml-axol1tl
    - cms-csctrackfinderemulation
    - rivet
    - yoda
  ignore_run_exports:
    from_package:
      - libclang
      - python-clang

tests:
  - script:
      - python -c "import ctypes, glob, os; libs = glob.glob(os.path.join(os.environ['CMSSW_BASE'], 'lib', os.environ['SCRAM_ARCH'], '*.[ds][oy]*')); assert libs; [ctypes.CDLL(lib, mode=ctypes.RTLD_GLOBAL) for lib in sorted(libs)]; print(len(libs), 'libraries loaded')"
      # a plugin from each stage this layer adds: unpacking, calorimeter and muon local
      # reconstruction, calorimeter towers, particle flow, electrons and jet clustering
      - edmPluginDump | grep -q EcalRawToDigi
      - edmPluginDump | grep -q HcalRawToDigi
      - edmPluginDump | grep -q CSCDCCUnpacker
      - edmPluginDump | grep -q EcalUncalibRecHitProducer
      - edmPluginDump | grep -q HBHEPhase1Reconstructor
      - edmPluginDump | grep -q CSCRecHitDProducer
      - edmPluginDump | grep -q DTRecHitProducer
      # RPC and the legacy L1 trigger, which need cms-l1t-utm (ASSUMED licence)
      - edmPluginDump | grep -q RPCUnpackingModule
      - edmPluginDump | grep -q RPCRecHitProducer
      - edmPluginDump | grep -q L1GlobalTriggerRawToDigi
      - edmPluginDump | grep -q GctRawToDigi
      - edmPluginDump | grep -qw L1GlobalTrigger
      # the Stage-2 unpacker and the Stage-2 L1 packages it needs, moved here from
      # cmssw-sim-dqm once TensorFlow made the endcap muon track finder buildable
      - edmPluginDump | grep -qw L1TRawToDigi
      - edmPluginDump | grep -q L1TStage2Layer2Producer
      - edmPluginDump | grep -q L1TMuonEndCapTrackProducer
      - edmPluginDump | grep -q L1GTAlgoBlockProducer
      # the L1 Global Trigger emulator and the HLT framework, which the HLT, e/gamma HLT
      # producers, luminosity and Type-1 MET corrections need; the emulator's anomaly
      # detection model is cms-hls4ml-axol1tl (ASSUMED licence)
      - edmPluginDump | grep -q L1TGlobalProducer
      - edmPluginDump | grep -q HLTPrescaler
      # the Phase-2 L1 track trigger, which needs conifer
      - edmPluginDump | grep -q TTStubBuilder_Phase2TrackerDigi_
      - edmPluginDump | grep -q trackerTFP::ProducerCTB
      - edmPluginDump | grep -q CaloTowersCreator
      - edmPluginDump | grep -q FastjetJetProducer
      - edmPluginDump | grep -q PFProducer
      - edmPluginDump | grep -q GsfElectronProducer
      # MET, with the beam-halo identification that needs the CSC track finder (whose
      # emulation, cms-csctrackfinderemulation, is used on an ASSUMED licence)
      - edmPluginDump | grep -q PFMETProducer
      - edmPluginDump | grep -q CSCHaloDataProducer
      - edmPluginDump | grep -q CSCTFTrackProducer
      # PAT, and NanoAOD's table producers and output modules
      - edmPluginDump | grep -qw PATMuonProducer
      - edmPluginDump | grep -qw PATJetProducer
      - edmPluginDump | grep -q SimplePATMuonFlatTableProducer
      - edmPluginDump | grep -qw NanoAODOutputModule
      # the plugins patch 0010 lets be built: in-process b-tagging, e/gamma energy
      # calibration and tau identification
      - edmPluginDump | grep -q UnifiedParticleTransformerAK4ONNXJetTagsProducer
      - edmPluginDump | grep -q CalibratedPatElectronProducer
      - edmPluginDump | grep -qw DeepTauId
      # simulated NanoAOD's particle-level and Higgs STXS producers, which need Rivet
      - edmPluginDump | grep -q ParticleLevelProducer
      - edmPluginDump | grep -q HTXSRivetProducer
      - edmPluginDump | grep -q NanoAODRNTupleOutputModule
      - cmsRun test/localreco.py
      - python test/nano.py
    files:
      recipe:
        - test/

about:
  homepage: https://cms-sw.github.io
  summary: CMS reconstruction - raw data unpacking, calorimetry, muons, e/gamma, particle flow and jets
  description: |
    CMSSW is the software framework of the CMS experiment at CERN. This package adds the
    reconstruction that sits on top of cmssw-reco's tracking: unpacking of the detector's raw
    data, local reconstruction in the calorimeters and muon chambers, calorimeter towers,
    electrons and photons, particle flow, jet clustering and jet energy corrections,
    b-tagging and the calibration packages those read.

    It also has the RPC chambers' data formats, unpacking and local reconstruction, and the
    L1 trigger's conditions formats, legacy unpackers and emulator. Those need the L1 trigger
    menu library (cms-l1t-utm), which is used on the ASSUMPTION that it will be released
    under Apache-2.0: it has no licence yet. It has the Stage-2 L1 unpackers, with the
    Stage-2 data formats and the parts of the emulator they need, the L1 Global Trigger
    emulator and the HLT framework (HLTrigger/HLTcore), and the Phase-2 L1 track trigger.
    The L1 Global Trigger emulator needs the L1 trigger's ML models (cms-hls4ml-axol1tl),
    which are used on the same ASSUMPTION.

    It has MET, PAT and NanoAOD, so MiniAOD can be turned into NanoAOD with this layer and
    the ones below it. The MET producers' beam-halo identification includes the legacy L1
    CSC track finder, whose emulation (cms-csctrackfinderemulation) is also used on the
    ASSUMPTION that it will be released under Apache-2.0. NanoAOD's TauSpinner table is
    left out, for want of Tauola++.

    Left out for want of an external: the plugins that run a model on a Triton inference
    server, and the PF superclusters, which need the Triton client.
  license: Apache-2.0
  license_file: cmssw/LICENSE
  repository: https://github.com/cms-sw/cmssw

extra:
  recipe-maintainers:
    - ariostas
