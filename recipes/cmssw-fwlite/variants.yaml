# Each CMSSW release is validated against one ROOT and one CLHEP version, so build
# only against the conda-forge versions closest to the ones used by that release
# (CMSSW_20_1_0_pre2: ROOT 6.36.13, CLHEP 2.4.7.2) instead of the full global pinning.
# root_base is zipped with root_cxx_standard, and clhep with geant4, in the global pinning.
root_base:
  - "6.36.10"
root_cxx_standard:
  - "20"
clhep:
  - "2.4.7.2"
geant4:
  - "11.4.2"

# std::to_chars/from_chars for floating point types (used by std::format) need macOS 13.3
c_stdlib_version:
  - if: osx
    then: "13.3"
MACOSX_DEPLOYMENT_TARGET:
  - if: osx
    then: "13.3"

# conda-forge is migrating boost 1.88 -> 1.90 (migrations/libboost190.yaml in the pinning).
# DD4hep is already built against 1.90 on every variant, so the geometry layer cannot be
# installed next to a stack pinned at 1.88; these take the migration early. Drop this block
# once the global pinning moves and the values come from there.
libboost_devel:
  - "1.90"
libboost_headers:
  - "1.90"
libboost_python_devel:
  - "1.90"
