context:
  cmssw_tag: CMSSW_20_1_0_pre2
  version: "20.1.0pre2"
  cmssw_config_tag: V09-09-09
  scram_version: V3_00_95

package:
  name: cmssw-fwlite
  version: ${{ version }}

source:
  - url: https://github.com/cms-sw/cmssw/archive/refs/tags/${{ cmssw_tag }}.tar.gz
    sha256: 39afc8deff3e31952cc43699324b25bbc10e619abe616b0eb6c3c20b4746312e
    target_directory: cmssw
    patches:
      - patches/0001-CondFormats-find-libstdc-headers-in-conda-gcc-layout.patch
      - patches/0002-CondFormats-support-unpatched-boost-serialization.patch
      - patches/0003-SimDataFormats-support-upstream-HepMC2-WeightContainer.patch
      - patches/0004-FWCore-PluginManager-per-package-caches-and-CMSSW_PLUGIN_PATH.patch
      - patches/0005-Support-clang-and-libc++-on-macOS.patch
      # The CondFormats serialization generator asks `clang++ -v` for the default include
      # paths and hands them to libclang next to the build's own flags. On macOS the layer
      # builds unset SDKROOT (ROOT's interpreter must not see it), so clang++ reported the
      # default Xcode SDK while the flags carried -isysroot for another: libclang then saw two
      # SDKs' usr/include, and CondFormats/HcalObjects, whose headers reach <complex>, failed
      # with INFINITY and NAN undeclared. Probe with the flags' own sysroot instead.
      - patches/0006-CondFormats-probe-search-paths-with-the-build-sysroot.patch
  - url: https://github.com/cms-sw/cmssw-config/archive/refs/tags/${{ cmssw_config_tag }}.tar.gz
    sha256: 3326a15f8ba28ab984259d98a1798c1558d5f89664d01911441adefe802928ad
    target_directory: config
    patches:
      - cmssw-config-patches/0001-conda-build-environment-fixes.patch

build:
  number: 9
  skip:
    - win
    - osx and x86_64
  script:
    env:
      CMSSW_TAG: ${{ cmssw_tag }}
      CMSSW_CONFIG_TAG: ${{ cmssw_config_tag }}
      SCRAM_VERSION: ${{ scram_version }}
    file: build.sh
  dynamic_linking:
    # CMSSW libraries live in share/cmssw/<arch>/cms/cmssw/<version>/lib/<arch>
    rpath_allowlist:
      - share/cmssw/**
  prefix_detection:
    ignore_binary_files: true

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ compiler('fortran') }}
    - ${{ stdlib('c') }}
    - cms-scram
    - cmssw-toolbox ==${{ version }}
    - make
    - bash
    - sed
    - coreutils
    - findutils
    - grep
    - gawk
    - which
    - rsync
    - git
    # CondFormats serialization code is generated with libclang
    - clangxx
  host:
    - cms-scram
    - python
    - numpy
    - root_base
    # root_base comes in cxx20 and cxx23 builds; CMSSW 20_1 is C++20
    - root_cxx_standard
    - libboost-devel
    - tbb-devel
    - clhep
    - fmt
    - xerces-c
    - libuuid
    - eigen
    - vdt
    - hepmc2
    - hepmc3
    - tinyxml2
    - pybind11
    - zlib
    - xz
    - zstd
    - bzip2
    - pcre2
    - openssl
    - libxcrypt
    - gsl
    - openblas
    - alpaka
    - hls-arbitrary-precision-types
    - cms-md5
    - python-clang
    - libclang
  run:
    # so that users can create a developer area on top of the release
    - cms-scram
    - python
    - root_base
    # ROOT parses CMSSW headers at runtime (dictionaries), which include these headers
    - libboost-headers
    - tbb-devel
    - eigen
    - alpaka
    - hls-arbitrary-precision-types
  ignore_run_exports:
    from_package:
      - libclang
      - python-clang

tests:
  - script:
      - edmPluginDump | head
      # every library and plugin must be loadable (with RTLD_GLOBAL, like the edm PluginManager)
      - python -c "import ctypes, glob, os; libs = glob.glob(os.path.join(os.environ['CMSSW_BASE'], 'lib', os.environ['SCRAM_ARCH'], '*.[ds][oy]*')); assert libs; [ctypes.CDLL(lib, mode=ctypes.RTLD_GLOBAL) for lib in sorted(libs)]; print(len(libs), 'libraries loaded')"
      - edmFileInPath FWCore/ParameterSet/python/Config.py
      - python -c "import FWCore.ParameterSet.Config as cms; print(cms.Process('TEST'))"
      - python -c "from DataFormats.FWLite import Events, Handle"
      - python -c "import ROOT; ROOT.FWLiteEnabler.enable(); assert ROOT.TClass.GetClass('edm::Wrapper<std::vector<pat::io_v1::Muon> >').HasDictionary()"
      # the interpreter must be able to parse the CMSSW headers and their external includes
      - python -c "import ROOT; assert ROOT.gInterpreter.Declare('#include \"DataFormats/Common/interface/DataFrameContainer.h\"')"
      - python -c "import ROOT; assert ROOT.gInterpreter.Declare('#include \"DataFormats/PatCandidates/interface/Muon.h\"')"
      # ...and to build the C library's own modules with whatever SDK the user happens to have.
      # SDKROOT and CONDA_BUILD_SYSROOT are dropped first because the build and test environments
      # set them and users do not: conda-forge's ROOT 6.36 ships prebuilt Darwin modules that only
      # work with the SDK they were built against, which is why macOS pins a newer ROOT than the
      # release uses (see variants.yaml). CMSSW's own headers do not reach those modules, so the
      # checks above pass even when nothing else does.
      - python -c "import os; [os.environ.pop(v, None) for v in ('SDKROOT', 'CONDA_BUILD_SYSROOT')]; import ROOT; assert ROOT.gInterpreter.Declare('#include <unistd.h>')"

about:
  homepage: https://cms-sw.github.io
  summary: FWLite, the lightweight framework of the CMS experiment's software (CMSSW)
  description: |
    CMSSW is the software framework of the CMS experiment at CERN. This package provides
    FWLite: the CMS data formats with their ROOT dictionaries, plus the Python and C++
    tools needed to read CMS AOD/MiniAOD/NanoAOD files outside of the full framework.
  license: Apache-2.0
  license_file: cmssw/LICENSE
  repository: https://github.com/cms-sw/cmssw

extra:
  recipe-maintainers:
    - ariostas
