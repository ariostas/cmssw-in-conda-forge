context:
  cmssw_tag: CMSSW_20_1_0_pre2
  version: "20.1.0pre2"

package:
  name: cmssw-geometry
  version: ${{ version }}

source:
  - url: https://github.com/cms-sw/cmssw/archive/refs/tags/${{ cmssw_tag }}.tar.gz
    sha256: 39afc8deff3e31952cc43699324b25bbc10e619abe616b0eb6c3c20b4746312e
    target_directory: cmssw
    patches:
      - patches/0001-CondFormats-find-libstdc-headers-in-conda-gcc-layout.patch
      - patches/0002-CondFormats-support-unpatched-boost-serialization.patch
      - patches/0003-CondCore-CondDB-HOST_NAME_MAX-and-map-on-macOS.patch
      - patches/0004-Geometry-libstdc-internal-includes-and-missing-standard-ones.patch

build:
  number: 4
  skip:
    - win
    - osx and x86_64
  script:
    env:
      CMSSW_TAG: ${{ cmssw_tag }}
    file: build.sh
  dynamic_linking:
    rpath_allowlist:
      - share/cmssw/**
  prefix_detection:
    ignore_binary_files: true

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ compiler('fortran') }}
    - ${{ stdlib('c') }}
    - cms-scram
    - cmssw-toolbox ==${{ version }}
    - make
    - bash
    - sed
    - coreutils
    - findutils
    - grep
    - gawk
    - which
    - rsync
    # the CondFormats serialization code is generated with libclang
    - clangxx
  host:
    - cms-scram
    - cmssw-conditions ==${{ version }}
    # the same externals as the layers below, because the release's headers include them
    - python
    - numpy
    - root_base
    # root_base comes in cxx20 and cxx23 builds; CMSSW 20_1 is C++20
    - root_cxx_standard
    - libboost-devel
    - tbb-devel
    - clhep
    - fmt
    - xerces-c
    - libuuid
    - eigen
    - vdt
    - hepmc2
    - hepmc3
    - tinyxml2
    - zlib
    - xz
    - zstd
    - bzip2
    - pcre2
    - openssl
    - libxcrypt
    - gsl
    - openblas
    - alpaka
    - hls-arbitrary-precision-types
    - cms-md5
    - python-clang
    - libclang
    # conditions access
    - coral
    - frontier-client
    - sqlite
    - expat
    - libcurl
    # CondCore/CondDB also builds python bindings
    - pybind11
    - libboost-python-devel
    # the detector description itself
    - dd4hep
    # Geometry/HGCalCommonData is the one package here that needs Geant4
    - geant4
  run:
    - cms-scram
    - cmssw-conditions ==${{ version }}
    - python
    - root_base
    - coral
    - frontier-client
    # ROOT parses the release's headers at runtime, so these are run dependencies too
    - dd4hep
    - geant4
  ignore_run_exports:
    from_package:
      - libclang
      - python-clang

tests:
  - script:
      - python -c "import ctypes, glob, os; libs = glob.glob(os.path.join(os.environ['CMSSW_BASE'], 'lib', os.environ['SCRAM_ARCH'], '*.[ds][oy]*')); assert libs; [ctypes.CDLL(lib, mode=ctypes.RTLD_GLOBAL) for lib in sorted(libs)]; print(len(libs), 'libraries loaded')"
      # the detector description sources must be registered
      - edmPluginDump | grep -q DDDetectorESProducer
      - edmPluginDump | grep -q TrackerDigiGeometryESModule
      # Build a detector from the CMS XML with DD4hep. This is also what checks that the
      # XML-only packages were installed: they carry no code, so nothing else would notice if
      # they went missing, and FileInPath fails outright when the geometry or the materials
      # it includes are not there.
      - cmsRun test/geometry.py
    files:
      recipe:
        - test/

about:
  homepage: https://cms-sw.github.io
  summary: The CMS detector description and geometry records
  description: |
    CMSSW is the software framework of the CMS experiment at CERN. This package adds the
    detector description on top of cmssw-conditions: the DD4hep-based geometry builders, the
    detector XML, the tracker and calorimeter geometry records, the magnetic field engine and
    the track propagators that use them.
  license: Apache-2.0
  license_file: cmssw/LICENSE
  repository: https://github.com/cms-sw/cmssw

extra:
  recipe-maintainers:
    - ariostas
