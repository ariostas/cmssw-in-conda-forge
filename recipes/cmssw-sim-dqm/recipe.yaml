context:
  cmssw_tag: CMSSW_20_1_0_pre2
  version: "20.1.0pre2"

package:
  name: cmssw-sim-dqm
  version: ${{ version }}

source:
  - url: https://github.com/cms-sw/cmssw/archive/refs/tags/${{ cmssw_tag }}.tar.gz
    sha256: 39afc8deff3e31952cc43699324b25bbc10e619abe616b0eb6c3c20b4746312e
    target_directory: cmssw
    patches:
      # Newer protobuf marks SerializeToZeroCopyStream() and the streams' Close() [[nodiscard]],
      # and CMSSW builds with -Werror=unused-result. A DQM file that fails to write was being
      # ignored; now it throws.
      - patches/0001-DQMServices-FileIO-check-the-results-of-protobuf-writes.patch
      # Alignment/OfflineValidation calls boost::filesystem without naming the library in its
      # BuildFile; CMS gets it through their ROOT, conda-forge's does not link it.
      - patches/0002-Alignment-OfflineValidation-declare-boost-filesystem.patch
      # Classes sorted with a non-const operator< (TopQuarkAnalysis fit results, the ECAL test
      # beam hodoscope's tracks), which libc++'s sort cannot call on the const objects it
      # compares (libstdc++ happens to accept it).
      - patches/0003-Const-comparison-operators-for-libc.patch
      # Code nothing at CMS compiles on macOS:
      # - the macOS branch of HLTrigger/Timer's processor_model.cc declares `result` a second
      #   time (and kept the NUL sysctl counts in the length);
      # - DQMServices/FileIO uses `ulong`, a glibc typedef, for `unsigned long`;
      # - DQMServices/StreamerIO and Validation/Geometry call unlink() without <unistd.h>,
      #   which glibc pulls in.
      # - HeavyFlavorAnalysis/RecoDecay and DetectorDescription/OfflineDBLoader declare map
      #   iterators with a different key constness or comparator than the map they iterate,
      #   which libc++ keeps distinct types;
      # - DQM/EcalMonitorClient constructs a std::vector iterator from nullptr;
      # - DQM/SiStripMonitorHardware includes <ext/algorithm>, a libstdc++ extension it does not use;
      # - unqualified setiosflags(): libstdc++'s fmtflags is an enum in std, so argument-dependent
      #   lookup finds std::setiosflags; libc++'s is an integer, so nothing does;
      # - Alignment/OfflineValidation opens a std::ifstream on a boost::filesystem::path, which
      #   only libstdc++ converts implicitly;
      # - DQM/TrackerRemapper links libstdc++fs, which std::filesystem has not needed since
      #   GCC 9 and which libc++ does not have.
      - patches/0004-Build-on-macOS.patch

build:
  number: 0
  skip:
    - win
    - osx and x86_64
  script:
    env:
      CMSSW_TAG: ${{ cmssw_tag }}
    file: build.sh
  dynamic_linking:
    rpath_allowlist:
      - share/cmssw/**
  prefix_detection:
    ignore_binary_files: true

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ compiler('fortran') }}
    - ${{ stdlib('c') }}
    - cms-scram
    - cmssw-toolbox ==${{ version }}
    - make
    - bash
    - sed
    - coreutils
    - findutils
    - grep
    - gawk
    - which
    - rsync
    # protoc, for prepare.sh
    - libprotobuf
    # the CondFormats serialization code is generated with libclang
    - clangxx
  host:
    - cms-scram
    - cmssw-reco-objects ==${{ version }}
    # the same externals as the layers below, because the release's headers include them
    - python
    - numpy
    - root_base
    # root_base comes in cxx20 and cxx23 builds; CMSSW 20_1 is C++20
    - root_cxx_standard
    - libboost-devel
    - tbb-devel
    - clhep
    - fmt
    - xerces-c
    - libuuid
    - eigen
    - vdt
    - hepmc2
    - hepmc3
    - tinyxml2
    - zlib
    - xz
    - zstd
    - bzip2
    - pcre2
    - openssl
    - libxcrypt
    - gsl
    - openblas
    - alpaka
    - hls-arbitrary-precision-types
    - cms-md5
    - coral
    - frontier-client
    - sqlite
    - expat
    - libcurl
    - pybind11
    - libboost-python-devel
    # this layer brings in more CondFormats packages, whose serialization is generated
    - python-clang
    - libclang
    - dd4hep
    - geant4
    # from the reco layer
    # track refitting for alignment: RecoTracker/TrackProducer's plugins reach these
    # through Alignment/ReferenceTrajectories
    - gbl
    - mille
    # jet clustering, used by CommonTools/PileupAlgos and the muon rechit clusterer. The C++
    # library, not `fastjet`, which is the python bindings.
    # Build 5 is the last one that ships the headers. Build 6 (2026-09-22) moved them to a new
    # fastjet-cxx-devel, which requires cgal-cpp; every current cgal-cpp requires eigen-abi
    # 5.0.1, lwtnn requires eigen-abi 3.4.0, and so the solver falls back to cgal-cpp 5.x and
    # the long-gone boost-cpp and cannot resolve. Take fastjet-cxx-devel once lwtnn (or
    # cgal-cpp) is built against a matching eigen.
    - fastjet-cxx ==3.5.1 *_5
    - fastjet-contrib
    # particle properties, for SimGeneral/HepPDTRecord
    - heppdt
    # nlohmann/json, header only; RecoTracker/MkFitCore reads its configuration with it
    - nlohmann_json
    # the neural-net evaluator RecoTracker/FinalTrackSelectors uses for track quality
    - lwtnn
    # from the reco-objects layer
    # CMS's socket and I/O library; DQMServices/Core's network protocol (DQMNet) uses it
    - classlib
    - pcre
    # DQMServices/Core writes its histograms as protobuf; prepare.sh regenerates the C++ with
    # the protoc in `build`, which the global pinning keeps at the same version as this
    - libprotobuf
    # the CPU build; the CUDA one would pull the CUDA runtime in for nothing
    - onnxruntime-cpp * *_cpu
    # boosted decision trees for photon identification (PhysicsTools/XGBoost)
    - libxgboost * cpu_*
    - xrootd
    # new in this layer
    # WebDAV/HTTP file access (FWStorage/DavixAdaptor)
    - davix
    # HDF5 conditions and LHE files (CondCore/CondHDF5ESSource, GeneratorInterface/LHEInterface)
    - hdf5
    - highfive
    # parton densities, for the generator interface
    - lhapdf
    # the event display's GL rendering (Fireworks/Eve), through ROOT's RGL
    - glew
    # PerfTools/Callgrind's client requests; there is no macOS build of valgrind
    - if: linux
      then: valgrind
  run:
    - cms-scram
    - cmssw-reco-objects ==${{ version }}
    - python
    - root_base
    - coral
    - frontier-client
    # ROOT parses the release's headers at runtime, so these are run dependencies too
    - dd4hep
    - geant4
    - gbl
    - mille
    - fastjet-cxx
    - fastjet-contrib
    - heppdt
    - lwtnn
    - classlib
    - libprotobuf
    - onnxruntime-cpp * *_cpu
    - libxgboost * cpu_*
    # new in this layer
    - davix
    - hdf5
    - highfive
    - lhapdf
    - glew
  ignore_run_exports:
    from_package:
      - libclang
      - python-clang

tests:
  - script:
      - python -c "import ctypes, glob, os; libs = glob.glob(os.path.join(os.environ['CMSSW_BASE'], 'lib', os.environ['SCRAM_ARCH'], '*.[ds][oy]*')); assert libs; [ctypes.CDLL(lib, mode=ctypes.RTLD_GLOBAL) for lib in sorted(libs)]; print(len(libs), 'libraries loaded')"
      # a plugin each from DQM, validation and digitisation
      - edmPluginDump | grep -q DQMRootOutputModule
      - edmPluginDump | grep -q MultiTrackValidator
      - edmPluginDump | grep -q SiPixelDigitizer
      - cmsRun test/simdqm.py
    files:
      recipe:
        - test/

about:
  homepage: https://cms-sw.github.io
  summary: CMS data quality monitoring, validation, digitisation, fast simulation and analysis tools
  description: |
    CMSSW is the software framework of the CMS experiment at CERN. This package adds what the
    reconstruction layers leave: data quality monitoring (DQM) and validation, digitisation
    and pile-up mixing, fast simulation, alignment and calibration workflows, conditions
    tools and analysis tools.

    Plugins that need the HLT framework (HLTrigger/HLTcore), and through it the unlicensed L1
    trigger menu library `utm`, are left out, as are those that need event generators or
    CMS's own Geant4 extensions.
  license: Apache-2.0
  license_file: cmssw/LICENSE
  repository: https://github.com/cms-sw/cmssw

extra:
  recipe-maintainers:
    - ariostas
