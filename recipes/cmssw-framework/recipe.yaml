context:
  cmssw_tag: CMSSW_20_1_0_pre2
  version: "20.1.0pre2"

package:
  name: cmssw-framework
  version: ${{ version }}

source:
  - url: https://github.com/cms-sw/cmssw/archive/refs/tags/${{ cmssw_tag }}.tar.gz
    sha256: 39afc8deff3e31952cc43699324b25bbc10e619abe616b0eb6c3c20b4746312e
    target_directory: cmssw

build:
  number: 0
  skip:
    - win
    - osx and x86_64
  script:
    env:
      CMSSW_TAG: ${{ cmssw_tag }}
    file: build.sh
  dynamic_linking:
    rpath_allowlist:
      - share/cmssw/**
  prefix_detection:
    ignore_binary_files: true

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ compiler('fortran') }}
    - ${{ stdlib('c') }}
    - cms-scram
    - cmssw-toolbox ==${{ version }}
    - make
    - bash
    - sed
    - coreutils
    - findutils
    - grep
    - gawk
    - which
    - rsync
    - git
  host:
    - cms-scram
    - cmssw-fwlite ==${{ version }}
    - python
    - numpy
    - root_base
    - libboost-devel
    - tbb-devel
    - clhep
    - fmt
    - xerces-c
    - libuuid
    - eigen
    - vdt
    - tinyxml2
    - zlib
    - xz
    - zstd
    - bzip2
    - openssl
    - gsl
    - xrootd
    - cpu_features
    - alpaka
    - hls-arbitrary-precision-types
    - cms-md5
  run:
    - cms-scram
    - cmssw-fwlite ==${{ version }}
    - python
    - root_base
    - xrootd

tests:
  - script:
      - edmPluginDump | head
      - python -c "import ctypes, glob, os; libs = glob.glob(os.path.join(os.environ['CMSSW_BASE'], 'lib', os.environ['SCRAM_ARCH'], '*.[ds][oy]*')); assert libs; [ctypes.CDLL(lib, mode=ctypes.RTLD_GLOBAL) for lib in sorted(libs)]; print(len(libs), 'libraries loaded')"
      # write an EDM file and read it back with the full framework
      - cmsRun ${{ "%RECIPE_DIR%" if win else "$RECIPE_DIR" }}/test/write.py
      - cmsRun ${{ "%RECIPE_DIR%" if win else "$RECIPE_DIR" }}/test/read.py
      - edmProvDump test.root | head -30
      - edmFileUtil -P test.root
    files:
      recipe:
        - test/

about:
  homepage: https://cms-sw.github.io
  summary: The CMSSW event processing framework (cmsRun)
  description: |
    CMSSW is the software framework of the CMS experiment at CERN. This package adds the
    event processing framework on top of cmssw-fwlite: the cmsRun executable, the standard
    framework services, the EDM input and output modules and the storage layer that reads
    files locally and over XRootD.
  license: Apache-2.0
  license_file: cmssw/LICENSE
  repository: https://github.com/cms-sw/cmssw

extra:
  recipe-maintainers:
    - ariostas
