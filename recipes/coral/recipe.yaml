context:
  coral_version: CORAL_2_3_21
  version: "2.3.21"
  # the CMS fork of CORAL, as used by CMSSW_20_1_0_pre2 (branch cms/CORAL_2_3_21py3)
  coral_commit: 4fc6c24175682aff2d4299765b47b603a7b218d2
  cmssw_config_tag: V09-09-09
  scram_version: V3_00_95

package:
  name: coral
  version: ${{ version }}

source:
  - url: https://github.com/cms-externals/coral/archive/${{ coral_commit }}.tar.gz
    sha256: 737d3512dbec6ddfad3416e575108fe6db9aa7d6015872753c892e4bee75cece
    target_directory: coral
    patches:
      - patches/0001-CoralBase-silence-a-format-overflow-warning-with-new-gcc.patch
      - patches/0002-PyCoral-PyUnicode_GET_SIZE-was-removed-in-python-3.12.patch
      - patches/0003-CoralKernel-plugins-are-dylib-on-macOS.patch
  - url: https://github.com/cms-sw/cmssw-config/archive/refs/tags/${{ cmssw_config_tag }}.tar.gz
    sha256: 3326a15f8ba28ab984259d98a1798c1558d5f89664d01911441adefe802928ad
    target_directory: config
    patches:
      - cmssw-config-patches/0001-conda-build-environment-fixes.patch

build:
  number: 0
  skip:
    - win
    - osx and x86_64
  script:
    env:
      CORAL_VERSION: ${{ coral_version }}
      CMSSW_CONFIG_TAG: ${{ cmssw_config_tag }}
      SCRAM_VERSION: ${{ scram_version }}
    file: build.sh

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
    - cms-scram
    - cmssw-toolbox
    - make
    - bash
    - sed
    - coreutils
    - findutils
    - grep
    - gawk
    - which
    - rsync
  host:
    - python
    - libboost-devel
    - xerces-c
    - libuuid
    - openssl
    - sqlite
    - expat
    - zlib
    - frontier-client
  run:
    - python

tests:
  - package_contents:
      lib:
        - lcg_CoralBase
        - lcg_CoralKernel
        - lcg_CoralCommon
        - lcg_RelationalAccess
      files:
        - lib/liblcg_FrontierAccess*
        - lib/liblcg_SQLiteAccess*
        - include/LCG/RelationalAccess/ISessionProxy.h

about:
  homepage: https://twiki.cern.ch/twiki/bin/view/Persistency/Coral
  summary: CORAL, the LCG Common Relational Abstraction Layer
  description: |
    CORAL is a C++ abstraction layer for vendor-neutral access to relational databases,
    developed as part of the LCG Persistency Framework. The CMS experiment uses it to read
    detector conditions from SQLite files and from the Frontier web caching system. This
    package builds the CMS fork (cms-externals/coral) without the Oracle and MySQL backends.
  # UNRESOLVED: neither cms-externals/coral nor the upstream LCG repository carries a license
  # file or license headers. This has to be clarified with CERN/CMS before the package can be
  # submitted to conda-forge. See LICENSE-STATUS.md.
  license: LicenseRef-Unresolved
  license_file: LICENSE-STATUS.md
  repository: https://github.com/cms-externals/coral

extra:
  recipe-maintainers:
    - ariostas
